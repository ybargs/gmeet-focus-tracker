<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUP iSEENTA — Focus Dashboard</title>

  <!-- Fonts used -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;800&family=Poppins:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 1. Header (Navbar) ===== -->
  <header class="top-navbar">
    <div class="brand">
      <img src="assets/1.png" alt="PUP logo" class="brand-logo" />
      <span class="brand-text">PUP <span class="accent-i">i</span><span class="accent-seen">SEEN</span><span class="accent-ta">TA</span></span>
    </div>
    <nav class="nav-links">
      <a href="#" class="nav-item" id="nav-history">HISTORY</a>
      <a href="#" class="nav-item" id="nav-signin">SIGN IN</a>
    </nav>
  </header>

  <div class="page-body">

    <!-- ===== 2. Title & Subtitle ===== -->
    <section class="session-meta">
      <h1 class="course-title" id="course-title">INTE 301: SYSTEMS INTEGRATION AND APPLICATION</h1>
      <p class="course-sub">
        <span id="class-section">BSIT 3-5</span>
        <span class="divider">|</span>
        <span>Time: <span id="class-time">9:00 AM - 11:30 AM</span></span>
        <span class="divider">|</span>
        <span>Meet: <span class="code-link" id="meet-code">imi-ssy-ouo</span></span>
      </p>
    </section>

    <!-- ===== 3. Stat Cards ===== -->
    <section class="stats-row">
      <div class="stat-card card-attendance">
        <span class="stat-label">Attendance</span>
        <span class="stat-val" id="stat-attendance">0/0</span>
      </div>
      <div class="stat-card card-focused">
        <span class="stat-label">Focused</span>
        <span class="stat-val" id="stat-focused">0</span>
      </div>
      <div class="stat-card card-away">
        <span class="stat-label">Away</span>
        <span class="stat-val" id="stat-away">0</span>
      </div>
    </section>

    <!-- ===== 4. Main Deep Maroon Container ===== -->
    <section class="main-panel">

      <!-- Top control bar -->
      <div class="panel-header-bar">
        <div class="session-controls">
          <button class="img-btn" id="btn-start" type="button" aria-label="Start">
            <img src="assets/4-start.png" alt="Start" />
          </button>
          <button class="img-btn" id="btn-pause" type="button" aria-label="Pause">
            <img src="assets/4-pause.png" alt="Pause" />
          </button>
          <button class="img-btn" id="btn-end" type="button" aria-label="End">
            <img src="assets/4-end.png" alt="End" />
          </button>
        </div>

        <div class="timer-box">
          <span>Time Elapsed:</span>
          <span class="timer-value" id="timer-value">00:00:00</span>
        </div>
      </div>

      <!-- Legend + Table -->
      <div class="panel-content-grid">

        <!-- Left: Legend + Show Switchers -->
        <aside class="sidebar-legend">
          <div class="legend-card">
            <h4 class="legend-heading">LEGEND:</h4>
            <ul class="legend-list">
              <li>
                <span class="status-circle dot-active"></span>
                <span class="legend-text">Active</span>
              </li>
              <li>
                <span class="status-circle dot-away"></span>
                <span class="legend-text">Away</span>
              </li>
              <li>
                <span class="status-circle dot-idle"></span>
                <span class="legend-text">Idle</span>
              </li>
              <li>
                <span class="status-circle dot-left"></span>
                <span class="legend-text">Left</span>
              </li>
            </ul>
          </div>

          <button class="btn-show-switchers" id="btn-show-switchers" type="button">
            SHOW SWITCHERS
          </button>
        </aside>

        <!-- Right: Student Table -->
        <div class="table-container">
          <table class="roster-table">
            <thead>
              <tr>
                <th>Student</th>
                <th>Status</th>
                <th>Focus Duration</th>
                <th>Last Event</th>
              </tr>
            </thead>
            <!-- Populated dynamically by renderTable() in app.js -->
            <tbody id="student-tbody"></tbody>
          </table>
        </div>

      </div>
    </section>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
